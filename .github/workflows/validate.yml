name: Validate

# Walidacja HACS przydaje się tylko przy zgłoszeniu do domyślnego sklepu HACS.
# Dla custom repository jest zbędna, więc uruchamiamy ją ręcznie albo przy PR-ach
# - bez cotygodniowego crona i bez reagowania na pushe tagów.
on:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin
